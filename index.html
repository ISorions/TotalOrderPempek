<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pempek PO Total &amp; List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: paste panel on the left, live totals and per-person breakdown on the right; stacks on phones. */
:root {
  --bg: #f1f4f2;
  --surface: #ffffff;
  --ink: #15201c;
  --muted: #5a6a64;
  --line: #d8e0dc;
  --accent: #0e5a4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --good: #1d7a45;
  --warn: #a8561b;
  --warn-soft: #f7e6d8;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #161f1c; --ink: #e7efeb; --muted: #94a59e; --line: #28352f;
    --accent: #5fc5a8; --accent-ink: #08211a; --accent-soft: #17332b;
    --good: #5fc58a; --warn: #e0955a; --warn-soft: #3a2616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #161f1c; --ink: #e7efeb; --muted: #94a59e; --line: #28352f;
  --accent: #5fc5a8; --accent-ink: #08211a; --accent-soft: #17332b;
  --good: #5fc58a; --warn: #e0955a; --warn-soft: #3a2616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 34px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 17px; margin: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
label.cap, .cap { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
textarea {
  width: 100%; min-height: 540px; resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.55;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 12px;
}
@media (max-width: 860px) { textarea { min-height: 300px; } }
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; padding: 7px 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .n { font-family: var(--font-mono); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .chk { font-size: 12px; font-weight: 600; min-height: 18px; }
.tile .chk.ok { color: var(--good); }
.tile .chk.bad { color: var(--warn); }
.tile .pr { font-family: var(--font-mono); font-size: 16px; font-weight: 600; min-height: 24px; font-variant-numeric: tabular-nums; }
.tile.total { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.total .l { color: var(--accent-ink); opacity: 0.85; }
.tile.total .chk.ok, .tile.total .chk.bad { color: var(--accent-ink); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: 500; }
.okbar { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: 500; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
td.num, th.num { font-family: var(--font-mono); }
td .dot { color: var(--line); }
tfoot td { font-weight: 600; border-bottom: 0; background: var(--accent-soft); color: var(--ink); }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.grp h3 { font-family: var(--font-display); font-size: 15px; margin: 0; }
.grp .cnt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.groups { display: flex; flex-direction: column; gap: 20px; }
.out { font-family: var(--font-mono); font-size: 14px; min-height: 120px; resize: vertical; }
.empty { color: var(--muted); font-size: 14px; }
.menu-img { display: block; width: 100%; height: auto; max-width: min(100%, 300px); margin: 0 auto; border-radius: 4px; border: 1px solid var(--line); }
</style>

<script>
/*PARSE_START*/
function parsePO(text) {
  var PKT = /paket\s*(\d+)\s*(?:\(\s*(\d+)\s*\))?/gi;
  var written = { pk: {}, total: null, any: false };
  var title = "";
  var toks = [];
  var afterSep = false;
  text.split(/\r?\n/).forEach(function (raw) {
    var line = raw.trim();
    if (!line) return;
    if (/^[-–—_=─━*]{4,}$/.test(line)) { afterSep = true; return; }
    if (afterSep) {
      var w = line.match(/paket\s*(\d+)\s*\(\s*(\d+)\s*\)/i);
      if (w) { written.pk[+w[1]] = +w[2]; written.any = true; }
      var t = line.match(/^total\s*(\d+)/i);
      if (t && written.total === null) { written.total = +t[1]; written.any = true; }
      return;
    }
    if (!title && /^open\s*po/i.test(line)) { title = line; return; }
    var ms = Array.from(line.matchAll(PKT));
    if (ms.length) {
      var inline = line.slice(0, ms[0].index).replace(/^[-–•*\s]+/, "").trim();
      toks.push({ t: "o", inline: inline, orders: ms.map(function (m) { return [+m[1], m[2] ? +m[2] : 1]; }) });
    } else {
      toks.push({ t: "n", name: line.replace(/^[-–•*\s]+/, "").trim(), dash: /^[-–•*]/.test(line) });
    }
  });

  var people = [], group = "Orders", person = null;
  function getPerson(g, n) {
    for (var i = 0; i < people.length; i++) if (people[i].group === g && people[i].name === n) return people[i];
    var p = { group: g, name: n, q: {} };
    people.push(p);
    return p;
  }
  toks.forEach(function (tk, i) {
    var next = toks[i + 1];
    if (tk.t === "n") {
      var isGroup = next && ((next.t === "n" && !tk.dash) || (next.t === "o" && next.inline));
      if (isGroup) { group = tk.name; person = null; }
      else if (next && next.t === "o" && !next.inline) { person = getPerson(group, tk.name); }
      else { person = null; }
    } else {
      if (tk.inline) person = getPerson(group, tk.inline);
      if (!person) person = getPerson(group, "(no name)");
      tk.orders.forEach(function (o) { person.q[o[0]] = (person.q[o[0]] || 0) + o[1]; });
    }
  });
  people = people.filter(function (p) { return Object.keys(p.q).length; });

  var totals = {}, grand = 0;
  people.forEach(function (p) {
    Object.keys(p.q).forEach(function (k) { totals[k] = (totals[k] || 0) + p.q[k]; grand += p.q[k]; });
  });
  var pakets = Object.keys(totals).map(Number).sort(function (a, b) { return a - b; });
  return { title: title, people: people, totals: totals, grand: grand, pakets: pakets, written: written };
}
/*PARSE_END*/

var EXAMPLE = [
"SBD 6",
"-Lenny ",
"Paket 2",
"Paket 5",
"",
"Remington ",
"-Juli",
"Paket 2"
].join("\n");

var KEY = "pempek-po-tally-draft";
var PRICES = { 2: 16, 3: 13, 4: 14, 5: 15 };
function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
var src = document.getElementById("src");
var out = document.getElementById("out");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function load() { try { var v = localStorage.getItem(KEY); return v === null ? null : v; } catch (e) { return null; } }
function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

function render() {
  var r = parsePO(src.value);
  var price = 0;
  r.pakets.forEach(function (k) { price += (PRICES[k] || 0) * r.totals[k]; });
  document.getElementById("title").textContent = r.title ? r.title.replace(/\s+,/, ",").replace(/\s+/g, " ") : "Pempek PO Total & List";

  var tiles = document.getElementById("tiles");
  if (!r.people.length) {
    tiles.innerHTML = '<p class="empty">No orders found yet. Add a name followed by a line such as Paket 2 (3)</p>';
  } else {
    var h = "";
    r.pakets.forEach(function (k) {
      var chk = "";
      if (r.written.pk[k] !== undefined) {
        chk = r.written.pk[k] === r.totals[k]
          ? '<span class="chk ok">matches your total</span>'
          : '<span class="chk bad">you wrote ' + r.written.pk[k] + "</span>";
      } else { chk = '<span class="chk">&nbsp;</span>'; }
      h += '<div class="tile"><span class="l">Paket ' + k + '</span><span class="n">' + r.totals[k] + '</span><span class="pr">' + (PRICES[k] ? money(PRICES[k] * r.totals[k]) : "") + "</span>" + chk + "</div>";
    });
    var tchk = '<span class="chk">&nbsp;</span>';
    if (r.written.total !== null) {
      tchk = r.written.total === r.grand ? '<span class="chk ok">matches your total</span>' : '<span class="chk bad">you wrote ' + r.written.total + "</span>";
    }
    h += '<div class="tile total"><span class="l">Total pack</span><span class="n">' + r.grand + '</span><span class="pr">' + money(price) + "</span>" + tchk + "</div>";
    tiles.innerHTML = h;
  }

  var st = document.getElementById("status");
  if (!r.people.length) { st.innerHTML = ""; }
  else if (!r.written.any) { st.innerHTML = '<div class="okbar">Total Above</div>'; }
  else {
    var bad = r.pakets.filter(function (k) { return r.written.pk[k] !== undefined && r.written.pk[k] !== r.totals[k]; });
    Object.keys(r.written.pk).forEach(function (k) { if (r.totals[k] === undefined) bad.push(+k); });
    var totBad = r.written.total !== null && r.written.total !== r.grand;
    if (bad.length || totBad) {
      st.innerHTML = '<div class="notice">The count differs from the totals you wrote' + (bad.length ? " (Paket " + bad.join(", ") + ")" : "") + (totBad ? ", total " + r.written.total + " vs " + r.grand : "") + ". Check the list above.</div>";
    } else {
      st.innerHTML = '<div class="okbar">All totals match what you wrote. ' + r.people.length + " orders counted.</div>";
    }
  }

  var lines = r.pakets.map(function (k) { return "Paket " + k + "(" + r.totals[k] + ")"; });
  lines.push("TOTAL " + r.grand + " PACK");
  lines.push("TOTAL PRICE " + money(price));
  out.value = r.people.length ? lines.join("\n") : "";

  var gm = [], groups = {};
  r.people.forEach(function (p) { if (!groups[p.group]) { groups[p.group] = []; gm.push(p.group); } groups[p.group].push(p); });
  var gh = "";
  if (!gm.length) gh = '<p class="empty">Nothing to show yet.</p>';
  gm.forEach(function (g) {
    var ps = groups[g], gt = {}, gsum = 0, gpr = 0;
    var th = '<tr><th>Name</th>' + r.pakets.map(function (k) { return '<th class="num">Paket ' + k + "</th>"; }).join("") + '<th class="num">Pack</th><th class="num">Price</th></tr>';
    var body = ps.map(function (p) {
      var sum = 0, pr = 0;
      var cells = r.pakets.map(function (k) {
        var q = p.q[k] || 0; sum += q; pr += q * (PRICES[k] || 0); gt[k] = (gt[k] || 0) + q;
        return '<td class="num">' + (q ? q : '<span class="dot">·</span>') + "</td>";
      }).join("");
      gsum += sum; gpr += pr;
      return "<tr><td>" + esc(p.name) + "</td>" + cells + '<td class="num"><b>' + sum + '</b></td><td class="num">' + money(pr) + "</td></tr>";
    }).join("");
    var foot = '<tr><td>Group total</td>' + r.pakets.map(function (k) { return '<td class="num">' + (gt[k] || 0) + "</td>"; }).join("") + '<td class="num">' + gsum + '</td><td class="num">' + money(gpr) + "</td></tr>";
    gh += '<div class="grp"><header><h3>' + esc(g) + '</h3><span class="cnt">' + ps.length + (ps.length === 1 ? " person" : " people") + " · " + gsum + ' pack · ' + money(gpr) + '</span></header><div class="scroll"><table><thead>' + th + "</thead><tbody>" + body + "</tbody><tfoot>" + foot + "</tfoot></table></div></div>";
  });
  document.getElementById("groups").innerHTML = gh;
}

src.addEventListener("input", function () { save(src.value); render(); });
document.getElementById("btn-clear").addEventListener("click", function () { src.value = ""; save(""); render(); src.focus(); });
document.getElementById("btn-example").addEventListener("click", function () { src.value = EXAMPLE; save(EXAMPLE); render(); });
document.getElementById("btn-copy").addEventListener("click", function () {
  var btn = this, txt = out.value;
  function done() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy total"; }, 1500); }
  function fallback() { out.focus(); out.select(); try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select and copy"; } }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
});

var audioCtx = null;
function clickSound() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(520, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.13);
  } catch (e) {}
}
document.addEventListener("click", function (e) {
  if (e.target.closest && e.target.closest("button")) clickSound();
});

var saved = load();
src.value = saved !== null ? saved : EXAMPLE;
render();
</script>
